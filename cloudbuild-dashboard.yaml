steps:
  - name: "gcr.io/cloud-builders/docker"
    id: build-dashboard
    args:
      - build
      - -f
      - docker/Dockerfile.dashboard
      - -t
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/dashboard:latest"
      - .

images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/dashboard:latest"

timeout: 1200s

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

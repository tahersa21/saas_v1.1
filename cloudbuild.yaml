steps:
  # ── Build API image ────────────────────────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: build-api
    args:
      - build
      - -f
      - docker/Dockerfile.api
      - -t
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/api:${SHORT_SHA}"
      - -t
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/api:latest"
      - .

  # ── Build Dashboard image ──────────────────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: build-dashboard
    args:
      - build
      - -f
      - docker/Dockerfile.dashboard
      - --build-arg
      - VITE_API_URL=${_VITE_API_URL}
      - -t
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/dashboard:${SHORT_SHA}"
      - -t
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/dashboard:latest"
      - .

  # ── Push API image ─────────────────────────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: push-api
    waitFor: [build-api]
    args:
      - push
      - "--all-tags"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/api"

  # ── Push Dashboard image ───────────────────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: push-dashboard
    waitFor: [build-dashboard]
    args:
      - push
      - "--all-tags"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/dashboard"

  # ── Deploy API to Cloud Run ────────────────────────────────────────────────
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: deploy-api
    waitFor: [push-api]
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ai-gateway-api
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/api:${SHORT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=1Gi
      - --cpu=1
      - --min-instances=0
      - --max-instances=10
      - --concurrency=80
      - --timeout=300
      - --set-secrets=DATABASE_URL=DATABASE_URL:latest,JWT_SECRET=JWT_SECRET:latest,ENCRYPTION_KEY=ENCRYPTION_KEY:latest,ADMIN_EMAIL=ADMIN_EMAIL:latest,ADMIN_PASSWORD=ADMIN_PASSWORD:latest
      - --set-env-vars=NODE_ENV=production,PORT=8080,MIGRATIONS_DIR=/app/migrations

  # ── Deploy Dashboard to Cloud Run ─────────────────────────────────────────
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: deploy-dashboard
    waitFor: [push-dashboard]
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ai-gateway-dashboard
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/dashboard:${SHORT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=3000
      - --memory=256Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=5
      - --concurrency=200
      - --timeout=60
      - --set-env-vars=NODE_ENV=production,PORT=3000

substitutions:
  _REGION: us-central1
  _REPO: ai-gateway
  _VITE_API_URL: ""

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
